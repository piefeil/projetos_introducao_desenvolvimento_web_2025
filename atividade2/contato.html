<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contato.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Piedra&display=swap" rel="stylesheet">

    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">

</head>
<body>
    <header>
        <img src="img/icon.png" alt="">
        <h1 class="piedra-regular">BCC</h1>
    </header>

    <nav>
        <ul id="menu">
            <li><a href="index.html">Página Inicial</a></li>
            <li><a href="produtos.html">Produtos</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
    </nav>

    <main>

        <div>
            <h1 id="titulo">Contato</h1>
            <p id="subtitulo">Adicione suas informações</p>
        </div>

        <form action="#">
            <div class="campo">
                <label for="nome">Informe o seu nome</label>
                <input id="nome" type="text" placeholder="Digite seu nome aqui" required>
            </div>

            <div class="campo">
                <label for="telefone">Informe seu telefone:</label>
                <input id="telefone" type="text" placeholder="Digite seu telefone aqui" required>
            </div>

            <div class="campo">
                <label for="email">Informe seu E-mail:</label>
                <input id="email" type="email" required>
            </div>

            <div class="campo">
                <label for="mensagem">Nos deixe uma mensagem:</label>
                <textarea name="observacoes" id="observacoes" rows="3" placeholder="Escreva aqui sua mensagem..."></textarea>
            </div>

            <button type="submit" class="botao">Enviar</button>

        </form>

    </main>

    <footer>
        <div class="footer-container">
            <p>&copy; Books Cats & Coffee. Todos os direitos reservados.</p>
            
            <div class="footer-info">
                <p><strong>Endereço:</strong> Rua Exemplo, 123 - Cidade, Estado</p>
                <p><strong>Telefone:</strong> (99) 9999-9999</p>
                <p><strong>E-mail:</strong> contato@empresa.com</p>
            </div>
    
            <nav class="footer-nav">
                <a href="index.html">Quem Somos</a>
                <a href="produtos.html">Produtos</a>
                <a href="contato.html">Contato</a>
                <a href="#">Política de Privacidade</a>
            </nav>
    
            <div class="rede-social">
                <a href="#"><img src="img/icone-facebook.png" alt="Facebook"></a>
                <a href="#"><img src="img/icone-instagram.png" alt="Instagram"></a>
                <a href="#"><img src="img/icone-linkedin.png" alt="LinkedIn"></a>
            </div>
        </div>
    </footer>
    
</body>
</html>
